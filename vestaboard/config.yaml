name: Vestaboard
version: "0.1.17"
slug: vestaboard
description: Pushes messages to my Vestaboard from Home Assistant events
url: https://github.com/hjfreyer/vestaboard
arch:
  - aarch64
  - amd64
  - armv7
init: false
boot: auto
startup: application
homeassistant_api: true
# The art gallery. Home Assistant serves it itself, so the port is never
# published: the app page grows an "Open Web UI" button, and the sidebar entry
# is a toggle on that page. ingress_port has to match DEFAULT_WEB_PORT in
# settings.py, since Supervisor proxies this port and no other.
ingress: true
ingress_port: 8099
panel_icon: mdi:palette
panel_title: Vestaboard
options:
  api_token: ""
  log_level: info
  dry_run: false
schema:
  api_token: password
  log_level: list(debug|info|warning|error)
  dry_run: bool
