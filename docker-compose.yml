# Fallback for a Home Assistant install without the app store (HA Container or
# Core). Create a long-lived access token in Home Assistant under your
# profile, put the values in a .env file next to this one, then:
#
#   docker compose up -d --build     # first run
#   git pull && docker compose up -d --build   # every update
services:
  vestaboard:
    build: ./vestaboard
    restart: unless-stopped
    # The art gallery. Under the app store this is ingress and not published at
    # all; here there is no ingress, so reach it at http://localhost:8099/.
    ports:
      - "${WEB_PORT:-8099}:8099"
    # Captured art lives in /data, which under the app store is storage
    # Supervisor keeps. Here it is a directory next to this file.
    volumes:
      - ./data:/data
    environment:
      VESTABOARD_API_TOKEN: ${VESTABOARD_API_TOKEN}
      HASS_URL: ${HASS_URL:-http://homeassistant.local:8123}
      HASS_TOKEN: ${HASS_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Los_Angeles}
      # The broker to put the device on. Under the app store Supervisor says
      # which; here it has to be named. Leave MQTT_HOST unset for no device.
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
